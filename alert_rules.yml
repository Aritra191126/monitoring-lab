groups:
  - name: flaky_alerts
    rules:
      - alert: FlakyHighErrorRate
        expr: rate(https_requests_total{handler="/flaky", status="5xx"}[5m])/rate(https_requests_total{handler="/flaky"}[5m]) > 0.35
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Flaky endpoint error rate above 35%"  
  - name: redis_alerts
    rules:
      - alert: RedisTooManyConnections
        expr: redis_connected_clients > 20
        for: 15s
        labels:
          severity: warning
        annotations: 
          summary: "Redis has more than 20 connected clients"        